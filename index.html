<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/gift.css">
   <title>Tip_Calc</title>
</head>
<body>
   <h1>Quick Tip Finder</h1>

   <div id="container">
      <form class="giftForm">
         <input type="text" id="tip" placeholder="Enter bill amount">
         <input type="text" id="tipPercent" placeholder="Enter tip percent %">
         <button type="button" id="submit">Calculate</button>

      </form>
      <div id="result">
         <p>
            Tip amount: $<span id="tipAm">0.00</span>
         </p>
         <p>
            Total amount: $<span id="total">0.00</span>
         </p>
      </div>
      <div id="reset">
         <button type="button" id="resetButton">X</button>
      </div>
   </div>

   <script src="scripts/tips.js"></script>
</body>
</html>
