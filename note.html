<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/note.css">
   <title>Note_App</title>
</head>
<body>
   <h1>Note App</h1>
   <div class="container">
      <div class="wrapper">
         <div class="head">
            <textarea id="note" placeholder="Write your note here..."></textarea>
            <button id="add">Add</button>
         </div>
         <div class="result">
            <ul id="list"></ul>
         </div>
         <!-- Move actions here -->
         <div class="actions">
            <button id="delete">X</button>
            <button id="clear">Clear</button>
         </div>
      </div>
   </div>
   <script src="scripts/note.js"></script>
</body>
</html>
